[project]
name = "callback-demo"
version = "0.1.0"
description = "Rock Pi 3A callback management demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pyserial>=3.5,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
