{% extends "base.html" %}
{% block page_title %}修改密码{% endblock %}
{% block content %}
  <div class="grid form-list">
    <section class="panel" style="max-width: 520px;">
      <div class="panel-head"><h2>首次登录修改密码</h2></div>
      <p class="subtle" style="padding: 0 18px;">
        该账号由台账导入审核应用后自动创建，初始密码为随机生成。为保障账号安全，
        首次登录必须先修改密码，之后才能进入系统。
      </p>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <form class="stack" method="post" action="/password-change">
        <label>
          当前密码
          <input type="password" name="old_password" required>
        </label>
        <label>
          新密码（至少 8 位）
          <input type="password" name="new_password" minlength="8" required>
        </label>
        <label>
          确认新密码
          <input type="password" name="confirm_password" minlength="8" required>
        </label>
        <button class="button primary" type="submit">保存新密码</button>
      </form>
    </section>
  </div>
{% endblock %}
