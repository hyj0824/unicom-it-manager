{% extends "base.html" %}
{% block title %}登录 - {{ app_title }}{% endblock %}
{% block auth_content %}
  <main class="login-wrap">
    <section class="login-panel">
      <div class="brand login-brand">
        <span class="brand-mark">政企</span>
        <span>{{ app_title }}</span>
      </div>
      <h1>登录</h1>
      <p class="login-hint">管理员使用 admin 账号和 ADMIN_PASSWORD；其他用户使用分配的用户名与密码。</p>
      {% if error %}
        <div class="alert error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <label>
          用户名
          <input name="username" value="admin" autofocus required>
        </label>
        <label>
          密码
          <input type="password" name="password" required>
        </label>
        <button class="button primary full" type="submit">登录</button>
      </form>
    </section>
  </main>
{% endblock %}
