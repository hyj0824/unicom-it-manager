{% extends "base.html" %}
{% block title %}登录 - {{ app_title }}{% endblock %}
{% block auth_content %}
  <main class="login-wrap">
    <section class="login-panel">
      <div class="brand login-brand">
        <img class="brand-mark" src="/static/unicom-icon.png" alt="中国联通">
        <span>中国联通</span>
      </div>
      <h1>登录</h1>
      <p class="login-hint">IT 运维客户信息管理系统<br />超管用户名为 admin，密码在 .env 文件配置</p>
      {% if error %}
        <div class="alert error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <label>
          用户名
          <input name="username" autofocus required>
        </label>
        <label>
          密码
          <input type="password" name="password" required>
        </label>
        <button class="button primary full" type="submit">登录</button>
      </form>
    </section>
  </main>
{% endblock %}
